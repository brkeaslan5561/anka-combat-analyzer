name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
    paths-ignore:
      - ".release-status/**"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Run worker smoke test
        run: npm run smoke:worker

      - name: Build Windows installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content release/SHA256SUMS.txt

      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anka-combat-analyzer-${{ steps.package.outputs.version }}-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Anka Combat Analyzer v${{ steps.package.outputs.version }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt

      - name: Record release status
        if: ${{ always() && startsWith(github.ref, 'refs/heads/release/') }}
        shell: pwsh
        run: |
          $version = "${{ steps.package.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "unknown"
          }

          New-Item -ItemType Directory -Path .release-status -Force | Out-Null
          [ordered]@{
            status = "${{ job.status }}"
            version = $version
            run_id = "${{ github.run_id }}"
            run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            commit = "${{ github.sha }}"
          } | ConvertTo-Json | Set-Content ".release-status/v$version.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status
          if (git diff --cached --quiet) {
            exit 0
          }
          git commit -m "Record v$version release status"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
